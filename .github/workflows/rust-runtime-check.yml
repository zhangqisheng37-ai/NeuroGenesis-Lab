name: Rust Runtime Check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install project with rust extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[rust]"

      - name: Build and install rust extension via maturin
        shell: bash
        run: |
          python -m maturin develop --release --manifest-path rust_src/neurogenesis_core/Cargo.toml

      - name: Runtime info check
        shell: bash
        run: |
          python -m neurogenesis_lab info

      - name: Import extension + component probe
        shell: bash
        run: |
          python scripts/pre_release_check.py
