 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"
 
 [project]
 name = "neurogenesis-lab"
 version = "0.2.0"
 requires-python = ">=3.10"
 dependencies = ["numpy>=1.24"]
 
 [project.scripts]
 neurogenesis-lab = "neurogenesis_lab.__main__:main"
 
 [tool.ruff]
 line-length = 100
 
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "[0-9][0-9]_*.py"]
