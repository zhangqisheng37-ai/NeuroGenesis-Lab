 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"
 
[project]
name = "neurogenesis-lab"
version = "0.6.0"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
rust = ["maturin>=1.7"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
neurogenesis-lab = "neurogenesis_lab.cli:main"

[tool.maturin]
manifest-path = "rust_src/neurogenesis_core/Cargo.toml"
module-name = "neurogenesis_lab._neurogenesis_core"
python-source = "src"
bindings = "pyo3"

[tool.hatch.build.targets.wheel]
packages = ["src/neurogenesis_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/neurogenesis_lab/py.typed" = "neurogenesis_lab/py.typed"

 [tool.ruff]
 line-length = 100
 
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "[0-9][0-9]_*.py"]
addopts = "--cov=src/neurogenesis_lab --cov-report=term-missing --cov-fail-under=75 --basetemp=.pytest_tmp"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
