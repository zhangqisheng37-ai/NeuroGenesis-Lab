# NeuroGenesis Lab — 学习增强配置
# 强调学习引擎，高预测奖励，鼓励规则发现

[simulation]
ticks = 300
seed = 42
dt = 1.0

[neuron]
v_rest = -65.0
v_reset = -65.0
v_th = -50.0
tau_m = 20.0
r_m = 1.0
spike_cost = 0.04
input_gain = 0.08
mem_size = 128  # 更大的记忆容量，利于模式发现

[network]
reproduction_threshold = 2.0
reproduction_share = 0.4
mutation_scale = 0.05
energy_decay = 0.002
max_neurons = 60
max_links = 240
corpse_ttl = 50
scavenger_radius = 2.5
input_current_scale = 2.0
move_cost = 0.008
energy_cap = 5.0
adaptive_decay = true
adaptive_reproduction = true
endangered_threshold = 10

[evolution]
mutation_amplitude = 0.05
energy_budget_per_tick = 0.0
congestion_penalty = 0.1
min_neurons = 5

[evolution.fitness_weights]
propagation = 0.5
energy_efficiency = 0.5
prediction_hit = 2.0  # 极高预测奖励权重

[learning]
auto_learn_interval = 5
max_rules = 1000
prediction_reward = 0.2  # 提高预测成功奖励
prediction_penalty = 0.05 # 提高预测失败惩罚
