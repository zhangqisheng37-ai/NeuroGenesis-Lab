# 高压环境挑战 (Hardcore Survival)
# 极端资源匮乏 + 高突变率，测试种群极限生存能力
# 适合寻找 "超级适应者" (Super-Adapter)

[simulation]
ticks = 2000                      # 超长程挑战
seed = 999                        # 新的随机种子
dt = 1.0

[neuron]
v_th = -45.0                      # [难点] 阈值提高，更难放电
spike_cost = 0.08                 # [难点] 放电成本翻倍
input_gain = 0.04                 # [难点] 能量摄入减半
mem_size = 64

[network]
max_neurons = 150                 # 大容量，但很难填满
max_links = 1000
reproduction_threshold = 3.5      # [难点] 繁殖门槛极高
reproduction_share = 0.6          # [难点] 母体牺牲更多能量
mutation_scale = 0.15             # [混乱] 极高突变率
energy_decay = 0.005              # [难点] 快速衰减
corpse_ttl = 20                   # [难点] 尸体迅速腐烂（资源回收窗口短）
move_cost = 0.02

[evolution]
mutation_amplitude = 0.15         # [混乱] 剧烈基因突变
congestion_penalty = 0.5          # [难点] 严厉的拥挤惩罚
min_neurons = 5                   # 最后的仁慈

[evolution.fitness_weights]
propagation = 0.5                 # 传播不再是首要
energy_efficiency = 2.0           # [目标] 只有极度节能者能生存
prediction_hit = 1.5              # [目标] 智力是生存的唯一出路
