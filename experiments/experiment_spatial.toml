# NeuroGenesis Lab — 空间连接配置
# 强调空间结构，神经元连接基于距离

[simulation]
ticks = 200
seed = 42
dt = 1.0

[neuron]
v_rest = -65.0
v_reset = -65.0
v_th = -50.0
tau_m = 20.0
r_m = 1.0
spike_cost = 0.04
input_gain = 0.08
mem_size = 64

[network]
reproduction_threshold = 1.8
reproduction_share = 0.35
mutation_scale = 0.05
energy_decay = 0.0015
max_neurons = 80
max_links = 320
corpse_ttl = 50
scavenger_radius = 2.5
input_current_scale = 2.0
move_cost = 0.005  # 降低移动成本，鼓励空间探索
energy_cap = 5.0
adaptive_decay = true
adaptive_reproduction = true
endangered_threshold = 10
# 空间连接参数
spatial_radius = 5.0
max_links_per_neuron = 8

[evolution]
mutation_amplitude = 0.05
energy_budget_per_tick = 0.0
congestion_penalty = 0.2  # 提高拥挤惩罚，鼓励分散
min_neurons = 5

[evolution.fitness_weights]
propagation = 1.0
energy_efficiency = 0.5
prediction_hit = 0.8
